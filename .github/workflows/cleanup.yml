name: Docker Cleanup

on: delete

permissions:
  contents: read

jobs:
  cleanup_branch:
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      # build.yml makes the branch tag with the same script.
      - name: remove docker tag
        shell: bash
        env:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          branch: ${{ github.event.ref }}
        run: |
          tag="$(.github/scripts/docker-branch-tag.sh "$branch")"
          docker run --rm lumir/remove-dockerhub-tag --user "$username" --password "$password" "l3uddz/autorefresh:$tag"
