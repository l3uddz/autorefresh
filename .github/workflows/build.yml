name: Build

on:
  push:
    branches:
      - "*"
    tags:
      - "v*"
  pull_request:
    branches:
      - main

# goreleaser needs write access to publish a GitHub release for a v* tag.
permissions:
  contents: write

env:
  IMAGE: l3uddz/autorefresh

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # checkout
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # tools: go and goreleaser, at the versions in mise.toml
      - name: mise
        uses: jdx/mise-action@v5

      - name: tool info
        run: |
          go version
          goreleaser --version

      # cache
      - name: cache-go
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      # vendor
      - name: vendor
        run: mise run vendor

      # go mod tidy must not change the committed module files.
      - name: tidy check
        run: git diff --exit-code -- go.mod go.sum

      # test
      - name: tests
        run: mise run test

      - name: lint
        run: mise run lint

      # Docker tags: the version and latest for a v* tag. Otherwise the
      # branch name, with each character that a Docker tag does not allow
      # replaced by a hyphen. cleanup.yml uses the same rule.
      - name: image tags
        id: image
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
            printf 'tags<<EOF\n%s:%s\n%s:latest\nEOF\n' "$IMAGE" "${REF_NAME#v}" "$IMAGE" >> "$GITHUB_OUTPUT"
          else
            branch="${HEAD_REF:-$REF_NAME}"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
            echo "tags=$IMAGE:${branch//[^A-Za-z0-9_.-]/-}" >> "$GITHUB_OUTPUT"
          fi

      # build
      - name: build
        if: steps.image.outputs.is_tag == 'false'
        run: mise run snapshot

      # publish
      - name: publish
        if: steps.image.outputs.is_tag == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run publish

      # artifacts
      - name: artifact_linux
        uses: actions/upload-artifact@v7
        with:
          name: build_linux
          path: dist/*linux*

      - name: artifact_darwin
        uses: actions/upload-artifact@v7
        with:
          name: build_darwin
          path: dist/*darwin*

      # docker
      - name: buildx
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: docker/setup-buildx-action@v4

      - name: docker login
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: docker build
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          pull: true
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.image.outputs.tags }}
