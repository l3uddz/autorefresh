name: docker-cleanup

on: delete

permissions:
  contents: read

jobs:
  cleanup_branch:
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      # ci.yml makes the branch tag with the same script. The image is
      # pinned by digest, because it receives the Docker Hub credentials.
      - name: remove docker tag
        shell: bash
        env:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          branch: ${{ github.event.ref }}
        run: |
          tag="$(.github/scripts/docker-branch-tag.sh "$branch")"
          docker run --rm lumir/remove-dockerhub-tag@sha256:9d5a167f76969cb22059f6accd191329856891cac2dcac5b2bfae84f746f1b4b --user "$username" --password "$password" "l3uddz/autorefresh:$tag"
