# https://goreleaser.com
version: 2

project_name: autorefresh

before:
  hooks:
    - mise run web-build

# Build
builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - freebsd
    main: ./cmd/autorefresh
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "7"
    ldflags:
      - -s -w
      - -X "main.Version={{ .Version }}"
      - -X "main.GitCommit={{ .ShortCommit }}"
      - -X "main.Timestamp={{ .Timestamp }}"
    tags:
      - webui
    flags:
      - -trimpath
    ignore:
      - goos: freebsd
        goarch: arm64
      - goos: freebsd
        goarch: arm

# MacOS Universal Binaries
universal_binaries:
  - replace: true

# Archive
archives:
  - name_template: "{{ .ProjectName }}_v{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    formats:
      - binary

# Checksum
checksum:
  name_template: "checksums.txt"
  algorithm: sha512

# Snapshot
snapshot:
  version_template: "{{ .Major }}.{{ .Minor }}.{{ .Patch }}-dev+{{ .Branch }}"

# Changelog
# Release notes group the commits since the last tag by their Conventional
# Commit type. A commit goes to the first group that matches it, and
# "order" sets where each group appears.
changelog:
  use: git
  sort: asc
  abbrev: 7
  format: "{{ .Message }} ({{ .SHA }})"
  filters:
    exclude:
      - "^docs(\\(.*\\))?!?:"
      - "^test(\\(.*\\))?!?:"
      - "^Merge "
  groups:
    - title: Breaking changes
      regexp: '^[a-z]+(\([^)]*\))?!:'
      order: 0
    - title: Features
      regexp: '^feat(\([^)]*\))?:'
      order: 1
    - title: Bug fixes
      regexp: '^fix(\([^)]*\))?:'
      order: 2
    - title: Performance
      regexp: '^perf(\([^)]*\))?:'
      order: 3
    - title: Other changes
      order: 999
