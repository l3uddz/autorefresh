[tools]
go = "1.27"
goreleaser = "2.20.2"
golangci-lint = "2.15.0"

[tasks.vendor]
description = "Tidy the Go modules and create vendor/"
run = ["go mod tidy", "go mod vendor"]

[tasks.vendor-update]
description = "Update the Go dependencies and create vendor/"
run = ["go get -u ./...", { task = "vendor" }]

[tasks.test]
description = "Run the Go tests with the race detector"
run = "go test ./... -cover -v -race"

[tasks.format]
description = "Format the Go files with the formatters in .golangci.yml"
run = "golangci-lint fmt"

[tasks.lint]
description = "Check formatting, then run go vet, staticcheck, and the complexity limit"
# fmt --diff fails on a file that needs formatting. Both skip vendor/.
run = ["golangci-lint fmt --diff", "golangci-lint run"]

[tasks.build]
description = "Build a development binary in dist/"
depends = ["vendor"]
env = { CGO_ENABLED = "0" }
run = '''
go build -mod vendor -trimpath \
  -ldflags "-s -w -X main.Version=0.0.0-dev -X main.GitCommit=$(git rev-parse --short HEAD) -X main.Timestamp=$(date +%s)" \
  -o "dist/autorefresh_$(go env GOOS)_$(go env GOARCH)/autorefresh" \
  ./cmd/autorefresh
'''

[tasks.snapshot]
description = "Build a snapshot release in dist/ without publishing"
run = "goreleaser release --snapshot --clean"

[tasks.release]
description = "Build a release in dist/ without publishing"
run = "goreleaser release --skip=validate,publish --clean"

[tasks.publish]
description = "Build a release and publish it to GitHub"
run = "goreleaser release --clean"
